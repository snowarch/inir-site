name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated, hub-updated]
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INIR_DEV_TOKEN: ${{ secrets.INIR_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # The docs say what iNiR is about to ship: the base's development branch (snowarch/inir-dev prerelease, read
      # with INIR_DEV_TOKEN), public main when the token is missing. Cone mode keeps the files at the root too, so
      # VERSION and CHANGELOG.md come along for "What's new".
      - name: Check out iNiR's docs and release notes (development)
        if: env.INIR_DEV_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: snowarch/inir-dev
          ref: prerelease
          token: ${{ env.INIR_DEV_TOKEN }}
          path: inir
          sparse-checkout: docs
      - name: Check out iNiR's docs and release notes (public)
        if: env.INIR_DEV_TOKEN == ''
        uses: actions/checkout@v4
        with:
          repository: snowarch/iNiR
          ref: main
          path: inir
          sparse-checkout: docs
      # inir.space/hub/index.json is the official catalogue `inir hub` and setup read (inir-cli hub.go Official).
      # It is built first: the site's own /hub page reads it, and sync-docs serves it from public/hub.
      - name: Check out the hub
        uses: actions/checkout@v4
        with:
          repository: snowarch/inir-hub
          ref: main
          path: hub
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Build the hub catalogue
        run: |
          go install github.com/snowarch/inir-cli/cmd/inir@main
          (cd hub && inir hub build --out "$GITHUB_WORKSPACE/hub-out")
          mkdir -p hub-out/schema && cp hub/schema/hub.schema.json hub-out/schema/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The base's pages, then each family's from the hub (docs/<id>).
          INIR_DOCS: inir/docs:hub/docs/*
          INIR_FAMILIES: hub/families
          INIR_HUB: hub-out
          SITE_BASE: /
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: publish site"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
