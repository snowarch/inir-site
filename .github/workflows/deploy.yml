name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated, hub-updated]
  schedule:
    # Every 20 minutes the site looks at its sources and builds only when one moved since the last deploy, so a merge
    # to the hub or the base's docs reaches inir.space without a token on their side; once a day it builds anyway.
    - cron: '*/20 * * * *'
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  # What the published site was built from is in the gh-pages commit ("hub <sha>", "docs <sha>"): a scheduled run
  # builds only when a source moved since.
  moved:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.look.outputs.build }}
      hub: ${{ steps.look.outputs.hub }}
      docs: ${{ steps.look.outputs.docs }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hub=$(git ls-remote https://github.com/snowarch/inir-hub refs/heads/main | cut -f1)
          docs=$(git ls-remote https://github.com/snowarch/iNiR refs/heads/main | cut -f1)
          echo "hub=$hub" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          build=true
          if [ "${{ github.event_name }}" = schedule ] && [ "${{ github.event.schedule }}" != '17 5 * * *' ]; then
            last=$(gh api "repos/${{ github.repository }}/commits/gh-pages" --jq .commit.message 2>/dev/null || true)
            if grep -qx "hub $hub" <<<"$last" && grep -qx "docs $docs" <<<"$last"; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "hub ${hub::7}, docs ${docs::7}: build=$build"

  build:
    needs: moved
    if: needs.moved.outputs.build == 'true'
    runs-on: ubuntu-latest
    # One deploy at a time per branch; a newer one waits instead of cancelling a publish half-way (pull requests
    # only build, so a newer push replaces them).
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      # The docs say what people have: the base's main, so version, notes and pages move together with a release.
      # Cone mode keeps the files at the root too, so VERSION and CHANGELOG.md come along for "What's new".
      - name: Check out iNiR's docs, release notes, binds and IPC list
        uses: actions/checkout@v4
        with:
          repository: snowarch/iNiR
          ref: ${{ needs.moved.outputs.docs || 'main' }}
          path: inir
          sparse-checkout: |
            docs
            defaults/niri
            scripts/lib
      # inir.space/hub/index.json is the official catalogue `inir hub` and setup read (inir-cli hub.go Official).
      # It is built first: the site's own /hub page reads it, and sync-docs serves it from public/hub.
      - name: Check out the hub
        uses: actions/checkout@v4
        with:
          repository: snowarch/inir-hub
          ref: ${{ needs.moved.outputs.hub || 'main' }}
          path: hub
          # Whole history: each item's "added" and "updated" dates come from it.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Build the hub catalogue
        run: |
          go install github.com/snowarch/inir-cli/cmd/inir@main
          # Downloads and votes: stats.json on the hub's stats branch (its daily stats workflow).
          git -C hub fetch -q origin stats:refs/remotes/origin/stats || true
          (cd hub && inir hub build --out "$GITHUB_WORKSPACE/hub-out" \
            --packages-at https://github.com/snowarch/inir-hub/releases/download/packages)
          mkdir -p hub-out/schema && cp hub/schema/hub.schema.json hub-out/schema/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The base's pages, then each family's from the hub (docs/<id>).
          INIR_DOCS: inir/docs:hub/docs/*
          INIR_FAMILIES: hub/families
          INIR_HUB: hub-out
          SITE_BASE: /
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: publish site" -m "hub ${{ needs.moved.outputs.hub }}
          docs ${{ needs.moved.outputs.docs }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
