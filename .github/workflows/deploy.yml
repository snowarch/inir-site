name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cone mode keeps the files at the root too, so VERSION and CHANGELOG.md come along for "What's new".
      - name: Check out iNiR's docs and release notes
        uses: actions/checkout@v4
        with:
          repository: snowarch/iNiR
          ref: main
          path: inir
          sparse-checkout: docs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          INIR_DOCS: inir/docs
          SITE_BASE: /inir-site/
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: publish site"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
